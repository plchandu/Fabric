name: "CI - Fabric Artifact & Code Validation"

on:
  pull_request:
    branches:
      - dev
      - main
      - release/**
    paths:
      - "src/**"
      - "deployment/**"
      - "tests/**"
      - "data/**"
      - "pyproject.toml"
      - "requirements*.txt"
  push:
    branches:
      - dev
    paths:
      - "src/**"
      - "deployment/**"
      - "tests/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: "Lint, Security Audit & Unit Tests"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Set up Python Runtime (3.11)"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r deployment/requirements-cicd.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: "Code Linting (Ruff)"
        run: |
          echo "Running Ruff code analysis..."
          ruff check src/ deployment/ tests/ --select E,F,W,I

      - name: "Pre-Deployment Security & Repository Audit"
        run: |
          echo "Executing validate_repo.py audit gate..."
          python deployment/validate_repo.py

      - name: "Execute PyTest Unit Test Suite"
        run: |
          echo "Executing unit tests for AS400 conversions, SCD Type 2, and Silver DQ rules..."
          pytest tests/ -v --junitxml=junit/test-results.xml

      - name: "Upload Test Results Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: junit/test-results.xml
