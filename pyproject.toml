[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ips-fabric-modernization"
version = "1.0.0"
description = "Enterprise Data Platform Modernization: AS400 DB2 ERP to Microsoft Fabric & Power BI Direct Lake"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Fabric Lead Engineer", email = "fabricadmin@plchandugcp48gmail.onmicrosoft.com" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "azure-identity>=1.15.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "flake8>=6.1.0",
    "ruff>=0.1.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "B",      # flake8-bugbear
    "PL",     # Pylint
]
ignore = [
    "E402",   # Module level import not at top of file
    "PLR0913",# Too many arguments
    "F401",   # Unused import
]
exclude = [
    ".git",
    "node_modules",
    ".venv",
    "venv",
    "fs-settings.json",
    "notebook-settings.json",
    ".platform"
]

[tool.ruff.lint.per-file-ignores]
"notebook-content.py" = ["E402", "F821"]
